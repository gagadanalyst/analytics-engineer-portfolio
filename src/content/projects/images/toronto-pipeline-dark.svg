<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Toronto Housing Bottleneck Analytics — architecture</title>
<desc id="desc">Four-stage architecture: Toronto Open Data is ingested with Python and dlt into validated Parquet snapshots; successive extracts build observed SCD Type 2 history; the same dbt project models both DuckDB and Snowflake; and dbt documentation plus a Streamlit dashboard are published.</desc>
